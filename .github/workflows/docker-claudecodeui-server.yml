name: docker claudecodeui server ci

# 触发条件，例如推送到主分支
on:
  workflow_dispatch:
    inputs:
      action_name:
        description: 'Choose the action to perform'
        required: true
        default: 'build'
        type: string
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build --tag liuroy/goodluck-claudecodeui-server --file ./DockerFile .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push liuroy/goodluck-claudecodeui-server


